services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantora
      POSTGRES_USER: quantora
      POSTGRES_PASSWORD: ${QUANTORA_POSTGRES_PASSWORD:?set QUANTORA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quantora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantora -d quantora"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  quantora_postgres:
