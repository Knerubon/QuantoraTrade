[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantora-trade"
version = "0.1.0"
description = "Multi-asset quantitative trading research and execution platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "QuantoraTrade" }]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantora_trade"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["quantora_trade"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quantora_trade"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=quantora_trade --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quantora_trade"]

[tool.coverage.report]
fail_under = 80
show_missing = true
